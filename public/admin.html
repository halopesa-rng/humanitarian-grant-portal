<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title>

</head>
<body>

<div class="grid">
<label>Admin key<input id="adminKey" type="password" placeholder="Enter ADMIN_KEY"></label>
<div><button id="load">Load dashboard</button></div>
</div>
<div id="adminMsg" class="result hidden"></div>
</section>

<section class="card">
<h2>Applications</h2>
<div id="applications">Enter the admin key and load the dashboard.</div>
</section>

<section class="card">
<h2>Payment statements</h2>
<div id="payments">Enter the admin key and load the dashboard.</div>
</section>
</main>
<script src="/admin.js"></script>
</body>
</html>
